[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docreranker"
version = "0.1.0"
description = "Multimodal page retrieval, OpenRouter annotation, SFT and GRPO reranking"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "Pillow>=10.4,<13", "requests>=2.32,<3"]

[project.optional-dependencies]
data = ["pyarrow>=18,<23", "huggingface-hub>=0.34,<1"]
model = ["torch==2.9.1", "torchvision==0.24.1", "transformers==4.57.3", "accelerate==1.12.0", "peft==0.18.0", "qwen-vl-utils==0.0.14"]
train = ["torch==2.9.1", "torchvision==0.24.1", "transformers==4.57.3", "accelerate==1.12.0", "peft==0.18.0", "trl==0.26.2", "datasets==4.4.1", "qwen-vl-utils==0.0.14"]
demo = ["streamlit>=1.42,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
