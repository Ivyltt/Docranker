<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="835" viewBox="0 0 1100 835" role="img" aria-labelledby="title desc"><title id="title">One page. Four ways to represent and match it.</title><desc id="desc">Four methods distinguish text versus image input and one versus many vectors.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8aa17b"/></marker></defs><g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif"><rect x="1" y="1" width="1098" height="833" rx="18" fill="#f8faf5" stroke="#d9e4d3"/><text x="28" y="42" font-size="25" fill="#174d43" font-weight="700">One page. Four ways to represent and match it.</text><text x="28" y="72" font-size="16" fill="#65796b" font-weight="400">Input modality and the number of vectors are separate design choices.</text><text x="35" y="109" font-size="12" fill="#65796b" font-weight="700">INPUT</text><text x="210" y="109" font-size="12" fill="#65796b" font-weight="700">ENCODING</text><text x="560" y="109" font-size="12" fill="#65796b" font-weight="700">REPRESENTATION</text><text x="832" y="109" font-size="12" fill="#65796b" font-weight="700">QUERY MATCHING</text><rect x="20" y="126" width="1060" height="147" rx="12" fill="#fff" stroke="#d9e4d3"/><text x="37" y="153" font-size="17" fill="#174d43" font-weight="700">01 · Text + BM25</text><rect x="40" y="170" width="66" height="82" rx="5" fill="#fbfcf8" stroke="#d9e4d3"/><text x="48" y="186" font-size="10" fill="#174d43" font-weight="700">REITs</text><path d="M48 193h48 M48 199h39" stroke="#9db38f" stroke-width="2"/><rect x="49" y="218" width="10" height="14" rx="1" fill="#b6cf98" stroke="#d9e4d3"/><rect x="65" y="207" width="10" height="25" rx="1" fill="#608b67" stroke="#d9e4d3"/><rect x="81" y="212" width="10" height="20" rx="1" fill="#dceaba" stroke="#d9e4d3"/><text x="48" y="245" font-size="8" fill="#174d43" font-weight="400">US · 1960</text><path d="M123 214 L186 214" fill="none" stroke="#8aa17b" stroke-width="2" marker-end="url(#arrow)"/><text x="210" y="202" font-size="17" fill="#203c34" font-weight="400">Extract text / OCR</text><text x="210" y="231" font-size="15" fill="#65796b" font-weight="400">Terms and frequencies</text><path d="M492 214 L538 214" fill="none" stroke="#8aa17b" stroke-width="2" marker-end="url(#arrow)"/><text x="560" y="195" font-size="15" fill="#174d43" font-weight="700">REITs · US · 1960</text><text x="560" y="219" font-size="14" fill="#65796b" font-weight="400">{term → count, …}</text><text x="560" y="252" font-size="12" fill="#65796b" font-weight="400">Sparse term representation</text><path d="M777 214 L812 214" fill="none" stroke="#8aa17b" stroke-width="2" marker-end="url(#arrow)"/><text x="832" y="199" font-size="16" fill="#174d43" font-weight="600">Lexical overlap</text><text x="832" y="228" font-size="15" fill="#203c34" font-weight="400">BM25 term scoring</text><rect x="20" y="285" width="1060" height="147" rx="12" fill="#fff" stroke="#d9e4d3"/><text x="37" y="312" font-size="17" fill="#174d43" font-weight="700">02 · Text + one vector</text><rect x="40" y="329" width="66" height="82" rx="5" fill="#fbfcf8" stroke="#d9e4d3"/><text x="48" y="345" font-size="10" fill="#174d43" font-weight="700">REITs</text><path d="M48 352h48 M48 358h39" stroke="#9db38f" stroke-width="2"/><rect x="49" y="377" width="10" height="14" rx="1" fill="#b6cf98" stroke="#d9e4d3"/><rect x="65" y="366" width="10" height="25" rx="1" fill="#608b67" stroke="#d9e4d3"/><rect x="81" y="371" width="10" height="20" rx="1" fill="#dceaba" stroke="#d9e4d3"/><text x="48" y="404" font-size="8" fill="#174d43" font-weight="400">US · 1960</text><path d="M123 373 L186 373" fill="none" stroke="#8aa17b" stroke-width="2" marker-end="url(#arrow)"/><text x="210" y="361" font-size="17" fill="#203c34" font-weight="400">Extract text / OCR</text><text x="210" y="390" font-size="15" fill="#65796b" font-weight="400">Text encoder</text><path d="M492 373 L538 373" fill="none" stroke="#8aa17b" stroke-width="2" marker-end="url(#arrow)"/><rect x="570" y="355" width="13" height="9" rx="2" fill="#b3cc99" stroke="none"/><rect x="587" y="355" width="13" height="9" rx="2" fill="#729473" stroke="none"/><rect x="604" y="355" width="13" height="9" rx="2" fill="#dce9ca" stroke="none"/><rect x="621" y="355" width="13" height="9" rx="2" fill="#4c7d65" stroke="none"/><rect x="638" y="355" width="13" height="9" rx="2" fill="#b3cc99" stroke="none"/><rect x="655" y="355" width="13" height="9" rx="2" fill="#729473" stroke="none"/><rect x="672" y="355" width="13" height="9" rx="2" fill="#dce9ca" stroke="none"/><text x="560" y="411" font-size="12" fill="#65796b" font-weight="400">One vector per page / chunk</text><path d="M777 373 L812 373" fill="none" stroke="#8aa17b" stroke-width="2" marker-end="url(#arrow)"/><text x="832" y="358" font-size="16" fill="#174d43" font-weight="600">Global comparison</text><text x="832" y="387" font-size="15" fill="#203c34" font-weight="400">Dot product / cosine</text><rect x="20" y="444" width="1060" height="147" rx="12" fill="#fff" stroke="#d9e4d3"/><text x="37" y="471" font-size="17" fill="#174d43" font-weight="700">03 · Image + one vector</text><rect x="40" y="488" width="66" height="82" rx="5" fill="#fbfcf8" stroke="#d9e4d3"/><text x="48" y="504" font-size="10" fill="#174d43" font-weight="700">REITs</text><path d="M48 511h48 M48 517h39" stroke="#9db38f" stroke-width="2"/><rect x="49" y="536" width="10" height="14" rx="1" fill="#b6cf98" stroke="#d9e4d3"/><rect x="65" y="525" width="10" height="25" rx="1" fill="#608b67" stroke="#d9e4d3"/><rect x="81" y="530" width="10" height="20" rx="1" fill="#dceaba" stroke="#d9e4d3"/><text x="48" y="563" font-size="8" fill="#174d43" font-weight="400">US · 1960</text><path d="M123 532 L186 532" fill="none" stroke="#8aa17b" stroke-width="2" marker-end="url(#arrow)"/><text x="210" y="520" font-size="17" fill="#203c34" font-weight="400">Encode the page image</text><text x="2