rl(#arrow)"/><text x="210" y="679" font-size="17" fill="#203c34" font-weight="400">Encode the page image</text><text x="210" y="708" font-size="15" fill="#65796b" font-weight="400">Retain multiple position vectors</text><path d="M492 691 L538 691" fill="none" stroke="#8aa17b" stroke-width="2" marker-end="url(#arrow)"/><rect x="570" y="654" width="13" height="9" rx="2" fill="#b3cc99" stroke="none"/><rect x="587" y="654" width="13" height="9" rx="2" fill="#729473" stroke="none"/><rect x="604" y="654" width="13" height="9" rx="2" fill="#dce9ca" stroke="none"/><rect x="621" y="654" width="13" height="9" rx="2" fill="#4c7d65" stroke="none"/><rect x="638" y="654" width="13" height="9" rx="2" fill="#b3cc99" stroke="none"/><rect x="655" y="654" width="13" height="9" rx="2" fill="#729473" stroke="none"/><rect x="672" y="654" width="13" height="9" rx="2" fill="#dce9ca" stroke="none"/><rect x="570" y="667" width="13" height="9" rx="2" fill="#729473" stroke="none"/><rect x="587" y="667" width="13" height="9" rx="2" fill="#dce9ca" stroke="none"/><rect x="604" y="667" width="13" height="9" rx="2" fill="#4c7d65" stroke="none"/><rect x="621" y="667" width="13" height="9" rx="2" fill="#b3cc99" stroke="none"/><rect x="638" y="667" width="13" height="9" rx="2" fill="#729473" stroke="none"/><rect x="655" y="667" width="13" height="9" rx="2" fill="#dce9ca" stroke="none"/><rect x="672" y="667" width="13" height="9" rx="2" fill="#4c7d65" stroke="none"/><rect x="570" y="680" width="13" height="9" rx="2" fill="#dce9ca" stroke="none"/><rect x="587" y="680" width="13" height="9" rx="2" fill="#4c7d65" stroke="none"/><rect x="604" y="680" width="13" height="9" rx="2" fill="#b3cc99" stroke="none"/><rect x="621" y="680" width="13" height="9" rx="2" fill="#729473" stroke="none"/><rect x="638" y="680" width="13" height="9" rx="2" fill="#dce9ca" stroke="none"/><rect x="655" y="680" width="13" height="9" rx="2" fill="#4c7d65" stroke="none"/><rect x="672" y="680" width="13" height="9" rx="2" fill="#b3cc99" stroke="none"/><rect x="570" y="693" width="13" height="9" rx="2" fill="#4c7d65" stroke="none"/><rect x="587" y="693" width="13" height="9" rx="2" fill="#b3cc99" stroke="none"/><rect x="604" y="693" width="13" height="9" rx="2" fill="#729473" stroke="none"/><rect x="621" y="693" width="13" height="9" rx="2" fill="#dce9ca" stroke="none"/><rect x="638" y="693" width="13" height="9" rx="2" fill="#4c7d65" stroke="none"/><rect x="655" y="693" width="13" height="9" rx="2" fill="#b3cc99" stroke="none"/><rect x="672" y="693" width="13" height="9" rx="2" fill="#729473" stroke="none"/><text x="560" y="729" font-size="12" fill="#65796b" font-weight="400">Many vectors · 128 dimensions each</text><path d="M777 691 L812 691" fill="none" stroke="#8aa17b" stroke-width="2" marker-end="url(#arrow)"/><text x="832" y="676" font-size="16" fill="#174d43" font-weight="600">Position-level matching</text><text x="832" y="705" font-size="15" fill="#203c34" font-weight="400">Row maxima → sum</text><text x="30" y="788" font-size="14" fill="#65796b" font-weight="400">Questions use the matching representation. Colored cells are schematic, not measured vectors or attention.</text><text x="30" y="814" font-size="14" fill="#65796b" font-weight="400">These routes explain methods. This project has not benchmarked all four under matched conditions.</text></g></svg>