fill="#4c7d65" stroke="none"/><rect x="655" y="693" width="13" height="9" rx="2" fill="#b3cc99" stroke="none"/><rect x="672" y="693" width="13" height="9" rx="2" fill="#729473" stroke="none"/><text x="560" y="729" font-size="12" fill="#65796b" font-weight="400">每页多条 · 各 128 维</text><path d="M777 691 L812 691" fill="none" stroke="#8aa17b" stroke-width="2" marker-end="url(#arrow)"/><text x="832" y="676" font-size="16" fill="#174d43" font-weight="600">局部向量匹配</text><text x="832" y="705" font-size="15" fill="#203c34" font-weight="400">逐行最大 → 加总</text><text x="30" y="788" font-size="14" fill="#65796b" font-weight="400">问题须使用与页面对应的匹配方式；向量色块为示意，并非实际模型数值或注意力。</text><text x="30" y="814" font-size="14" fill="#65796b" font-weight="400">四条路线说明方法差别；本项目未对四者开展同条件性能对照。</text></g></svg>